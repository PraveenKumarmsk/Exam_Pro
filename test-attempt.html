<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Take Test — ExamPro</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231e3a8a'/%3E%3Cpath d='M9 22V10h13v3h-9v2h8v3h-8v4z' fill='%23fff'/%3E%3Ccircle cx='24' cy='24' r='4' fill='%237c3aed'/%3E%3C/svg%3E" />
<script>(function(){try{var t=localStorage.getItem('exampro-theme');if(!t&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)t='dark';if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="stylesheet" href="shared.css" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#1e3a8a" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" /><meta name="apple-mobile-web-app-capable" content="yes" /><meta name="apple-mobile-web-app-title" content="ExamPro" />
</head>
<body data-page="tests" data-search="Search tests…">

<div id="site-header"></div>

<main class="container runner-wrap">
  <div id="app"><div class="empty"><h3>Loading test…</h3></div></div>
</main>

<div id="site-footer"></div>

<script src="shared.js"></script>
<script>
(function () {
  const P = new URLSearchParams(location.search);
  const app = document.getElementById('app');
  const SESS = 'exampro-session';
  const LETTERS = ['A', 'B', 'C', 'D'];
  const QMAP = qById();
  let CFG = null, S = null, timer = null, runnerOn = false;
  let tqId = null, tqStart = 0;          // per-question time tracking
  let bigText = !!store.get('exampro-bigtext', false);

  /* ---------- utilities ---------- */
  function rng(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function shuffle(arr, r) {
    r = r || Math.random; const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function fmtQ(s) { return escapeHtml(s).replace(/\n/g, '<br>'); }
  function langPool(lang) {
    if (lang === 'Hindi') return QUESTIONS.filter(q => q.subject === 'Hindi');
    if (lang === 'English') return QUESTIONS.filter(q => q.subject !== 'Hindi');
    return QUESTIONS.slice();
  }
  function dateNum() { const d = new Date(); return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(); }

  /* ---------- build the test configuration from the URL ---------- */
  function buildConfig() {
    if (P.get('id')) {
      const t = TESTS.find(x => String(x.id) === P.get('id'));
      if (!t) return { error: { title: 'Test not found', msg: 'This test does not exist or has been removed.' } };
      return { mode: 'test', title: t.title, qids: t.ids.slice(), durMin: t.dur, lang: t.lang, testId: t.id, kind: t.type };
    }
    const mode = P.get('mode'), sub = P.get('subject') || '', ch = P.get('chapter') || '', diff = P.get('diff') || '';

    if (mode === 'custom') {
      let pool = langPool(P.get('lang') || 'Bilingual');
      if (sub) pool = pool.filter(q => q.subject === sub);
      if (diff && diff !== 'Mixed') pool = pool.filter(q => q.diff === diff);
      if (!pool.length) return { error: { title: 'No matching questions', msg: 'No demo questions match these custom-test settings yet. Try Mixed difficulty or a different subject or language.' } };
      const want = Math.max(1, parseInt(P.get('count'), 10) || 20);
      const qids = shuffle(pool).slice(0, Math.min(want, pool.length)).map(q => q.id);
      const exam = P.get('exam');
      return { mode, qids, lang: P.get('lang') || 'Bilingual', kind: 'Custom',
        title: 'Custom Test' + (exam ? ' — ' + exam : '') + (sub ? ' · ' + sub : ''),
        durMin: Math.min(180, Math.max(5, parseInt(P.get('dur'), 10) || 30)),
        note: qids.length < want ? `Only ${qids.length} matching demo questions are available, so this test has ${qids.length} questions instead of ${want}.` : '' };
    }
    if (mode === 'practice') {
      const pool = QUESTIONS.filter(q => (!sub || q.subject === sub) && (!ch || q.chapter === ch) && (!diff || diff === 'all' || q.diff === diff));
      if (!pool.length) return { error: { title: 'No questions here yet', msg: 'There are no demo questions for this chapter and difficulty yet. Try another chapter or "Any difficulty".' } };
      const want = Math.max(1, parseInt(P.get('count'), 10) || 10);
      const qids = shuffle(pool).slice(0, Math.min(want, pool.length)).map(q => q.id);
      return { mode, qids, lang: 'English', kind: 'Practice', durMin: Math.max(5, qids.length), title: (ch || sub || 'Mixed') + ' — Practice' };
    }
    if (mode === 'daily') {
      const qids = shuffle(QUESTIONS, rng(dateNum())).slice(0, 10).map(q => q.id);
      return { mode, qids, lang: 'Bilingual', kind: 'Daily', durMin: 10, title: 'Daily Practice — ' + new Date().toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) };
    }
    if (mode === 'important') {
      const pool = QUESTIONS.filter(q => q.imp);
      return { mode, qids: shuffle(pool).map(q => q.id), lang: 'Bilingual', kind: 'Important', durMin: Math.max(5, pool.length), title: 'Important Questions' };
    }
    if (mode === 'speed') {
      const qids = shuffle(QUESTIONS).slice(0, 15).map(q => q.id);
      return { mode, qids, lang: 'Bilingual', kind: 'Speed', durMin: 6, title: 'Speed Test — 15 questions, 6 minutes' };
    }
    if (mode === 'revision') {
      const ids = [...new Set([...getWrong(), ...getBookmarks()])].filter(id => QMAP[id]);
      if (!ids.length) return { error: { title: 'Nothing to revise yet', msg: 'Revision tests are built from questions you got wrong or bookmarked. Take a test or bookmark a few questions first.' } };
      const qids = shuffle(ids).slice(0, 30);
      return { mode, qids, lang: 'Bilingual', kind: 'Revision', durMin: Math.max(5, qids.length), title: 'Revision Test' };
    }
    if (mode === 'incorrect') {
      const ids = getWrong().filter(id => QMAP[id]);
      if (!ids.length) return { error: { title: 'Nothing to retry yet', msg: 'Questions you answer incorrectly in any test are collected here for practice. Take a test first — you have no incorrect answers saved right now.' } };
      const qids = shuffle(ids).slice(0, 25);
      return { mode, qids, lang: 'Bilingual', kind: 'Incorrect', durMin: Math.max(5, qids.length), title: 'Incorrect Questions — Retry' };
    }
    if (mode === 'bookmarks') {
      const ids = getBookmarks().filter(id => QMAP[id]);
      if (!ids.length) return { error: { title: 'No bookmarked questions', msg: 'Tap the ☆ star on any question during a test or in a result review to save it here for later practice.' } };
      return { mode, qids: shuffle(ids).slice(0, 50), lang: 'Bilingual', kind: 'Bookmarks', durMin: Math.max(5, Math.min(ids.length, 50)), title: 'Bookmarked Questions' };
    }
    return { error: { title: 'No test selected', msg: 'Choose a mock test, a chapter to practise, or build a custom test.' } };
  }

  /* ---------- session (resume after refresh) ---------- */
  function loadSession(sig) { const s = store.get(SESS, null); return s && s.sig === sig && !s.done && s.start ? s : null; }
  function saveSession() { if (S && !S.done) store.set(SESS, S); }

  /* ---------- per-question time ---------- */
  function commitTime() {
    if (!S || !tqId) return;
    const add = Math.min(600, Math.max(0, (Date.now() - tqStart) / 1000));
    S.qt = S.qt || {}; S.qt[tqId] = Math.round(((S.qt[tqId] || 0) + add) * 10) / 10;
    tqStart = Date.now();
  }

  /* ---------- views ---------- */
  function renderError(e) {
    app.innerHTML = `<div class="empty panel" style="padding:56px 24px">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.01"/></svg>
      <h3>${escapeHtml(e.title)}</h3><p>${escapeHtml(e.msg)}</p>
      <div class="btn-row"><a href="tests.html" class="btn btn-primary">Browse Mock Tests</a><a href="practice.html" class="btn btn-outline">Practice by Chapter</a><a href="index.html" class="btn btn-ghost">Home</a></div></div>`;
  }

  function renderIntro() {
    runnerOn = false; const n = CFG.qids.length;
    app.innerHTML = `
      <div class="t-card intro" style="max-width:820px;margin:0 auto">
        <span class="badge-pill badge-info">${escapeHtml(CFG.kind || 'Test')}</span>
        <span class="badge-pill badge-premium" style="margin-left:6px">Demo questions</span>
        <h2>${escapeHtml(CFG.title)}</h2>
        ${CFG.note ? `<div class="dev-note">${escapeHtml(CFG.note)}</div>` : ''}
        <div class="stats-grid">
          <div class="stat"><div class="num">${n}</div><div class="lbl">Questions</div></div>
          <div class="stat"><div class="num">${CFG.durMin}</div><div class="lbl">Minutes</div></div>
          <div class="stat"><div class="num">${n}</div><div class="lbl">Marks</div></div>
          <div class="stat"><div class="num" style="font-size:1.1rem;line-height:2.4rem">${escapeHtml(CFG.lang)}</div><div class="lbl">Language</div></div>
        </div>
        <h3>Instructions</h3>
        <ul class="rules">
          <li>Each question carries 1 mark. There is <strong>no negative marking</strong>.</li>
          <li>The timer counts down and the test is <strong>submitted automatically</strong> when time ends.</li>
          <li>Use the question palette to jump around. Mark a question for review to come back to it, or tap ☆ to save it for later practice.</li>
          <li>If you refresh the page, your answers and remaining time are kept on this device.</li>
          <li>Keyboard: ← / → to move, A–D (or 1–4) to choose an option, M to mark for review.</li>
          <li>The result page shows time spent on every question. These are demo questions, not official exam questions.</li>
        </ul>
        <h3>Palette colours</h3>
        <div class="legend" style="margin-bottom:0">
          <span class="lg"><i></i>Not visited</span><span class="lg"><i class="seen"></i>Not answered</span>
          <span class="lg"><i class="ans"></i>Answered</span><span class="lg"><i class="mark"></i>Marked for review</span>
        </div>
        <div class="t-actions" style="margin-top:26px">
          <a class="btn btn-outline" href="tests.html">← Back</a><span class="spacer"></span>
          <button type="button" class="btn btn-primary btn-lg" data-act="start">Start Test →</button>
        </div>
      </div>`;
  }

  function startTest() {
    const u = getUser();
    if (typeof track === 'function') track('test_start', { kind: CFG.kind || 'Test' });
    S = { sig: location.search, title: CFG.title, mode: CFG.mode, testId: CFG.testId || null, kind: CFG.kind || '',
      examId: new URLSearchParams(location.search).get('exam') || null, qids: CFG.qids.slice(), durSec: CFG.durMin * 60, start: Date.now(),
      ans: {}, marked: {}, visited: {}, qt: {}, cur: 0, done: false, user: u ? { name: u.name, email: u.email || '' } : null };
    saveSession(); renderRunner();
  }

  function renderRunner() {
    runnerOn = true;
    app.innerHTML = `
      <div class="t-top">
        <div><div class="t-title">${escapeHtml(S.title)}</div><div class="t-sub">${S.qids.length} questions · demo content</div></div>
        <div class="row">
          <span class="size-ctl"><button type="button" data-act="font" aria-label="Toggle larger text" title="Larger text">A+</button></span>
          <div class="t-timer" id="timer">⏱ --:--</div>
        </div>
      </div>
      <div class="t-layout">
        <div><div class="t-card" id="qcard"></div><div class="t-actions" id="qactions"></div></div>
        <aside class="t-side">
          <h4>Question Palette</h4>
          <div class="legend">
            <span class="lg"><i></i>Not visited</span><span class="lg"><i class="seen"></i>Not answered</span>
            <span class="lg"><i class="ans"></i>Answered</span><span class="lg"><i class="mark"></i>Marked</span>
          </div>
          <div class="pal" id="pal"></div>
          <div id="palStats" style="font-size:.78rem;color:var(--text-muted);margin-top:12px"></div>
          <button type="button" class="btn btn-primary" data-act="submit" style="width:100%;margin-top:14px">Submit Test</button>
        </aside>
      </div>`;
    tqId = null; draw(); startTimer();
  }

  function palClass(id, i) {
    const a = S.ans[id] !== undefined, m = !!S.marked[id]; let c = '';
    if (m && a) c = 'mark markans'; else if (m) c = 'mark'; else if (a) c = 'ans'; else if (S.visited[id]) c = 'seen';
    if (i === S.cur) c += ' cur';
    return c.trim();
  }

  function draw() {
    commitTime();
    const qid = S.qids[S.cur], q = QMAP[qid];
    tqId = qid; tqStart = Date.now();
    S.visited[qid] = 1;
    const sel = S.ans[qid], last = S.cur === S.qids.length - 1, bm = getBookmarks().includes(qid);

    document.getElementById('qcard').innerHTML = `
      <div class="t-meta">
        <strong style="color:var(--text)">Question ${S.cur + 1} of ${S.qids.length}</strong>
        <span class="badge-pill badge-info">${escapeHtml(q.subject)}</span>
        <span class="badge-pill ${diffClass(q.diff)}">${escapeHtml(q.diff)}</span>
        ${S.marked[qid] ? '<span class="badge-pill badge-premium">Marked for review</span>' : ''}
        <span style="margin-left:auto"><button type="button" class="q-bookmark${bm ? ' on' : ''}" data-act="bm" aria-label="Bookmark question" title="Save for later">${bm ? '★' : '☆'}</button></span>
      </div>
      ${q.passage ? `<div class="t-passage">${escapeHtml(q.passage)}</div>` : ''}
      <div class="t-q${bigText ? ' big' : ''}">${fmtQ(q.q)}</div>
      ${q.opts.map((o, i) => `<button type="button" class="t-opt${bigText ? ' big' : ''}${sel === i ? ' sel' : ''}" data-opt="${i}" aria-pressed="${sel === i}"><span class="let">${LETTERS[i]}</span><span>${escapeHtml(o)}</span></button>`).join('')}`;

    document.getElementById('qactions').innerHTML = `
      <button type="button" class="btn btn-outline" data-act="prev" ${S.cur === 0 ? 'disabled' : ''}>← Previous</button>
      <button type="button" class="btn btn-outline" data-act="clear" ${sel === undefined ? 'disabled' : ''}>Clear Response</button>
      <button type="button" class="btn btn-outline" data-act="mark">${S.marked[qid] ? 'Unmark Review' : (last ? 'Mark for Review' : 'Mark for Review &amp; Next')}</button>
      <span class="spacer"></span>
      <button type="button" class="btn btn-primary" data-act="next">${last ? 'Save' : 'Save &amp; Next'}</button>`;

    document.getElementById('pal').innerHTML = S.qids.map((id, i) =>
      `<button type="button" class="${palClass(id, i)}" data-go="${i}" aria-label="Question ${i + 1}">${i + 1}</button>`).join('');
    const answered = S.qids.filter(id => S.ans[id] !== undefined).length, marked = S.qids.filter(id => S.marked[id]).length;
    document.getElementById('palStats').textContent = `${answered} answered · ${S.qids.length - answered} not answered · ${marked} marked`;
    saveSession();
  }

  /* ---------- timer ---------- */
  function remaining() { return Math.max(0, S.durSec - Math.floor((Date.now() - S.start) / 1000)); }
  function tick() {
    if (!S || S.done) return;
    const r = remaining(), el = document.getElementById('timer');
    if (el) { el.textContent = '⏱ ' + fmtTime(r); el.classList.toggle('low', r <= 60); }
    if (r <= 0) finish(true);
  }
  function startTimer() { clearInterval(timer); tick(); if (S && !S.done) timer = setInterval(tick, 1000); }

  /* ---------- submit ---------- */
  function closeModal() { const m = document.getElementById('modal'); if (m) m.remove(); }
  function openSubmit() {
    closeModal();
    const total = S.qids.length, answered = S.qids.filter(id => S.ans[id] !== undefined).length, marked = S.qids.filter(id => S.marked[id]).length;
    const m = document.createElement('div'); m.className = 'modal-back'; m.id = 'modal';
    m.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="Submit test">
      <h3>Submit test?</h3>
      <p style="font-size:.9rem;color:var(--text-muted)">You cannot change your answers after submitting.</p>
      <ul>
        <li><span>Answered</span><strong>${answered}</strong></li>
        <li><span>Not answered</span><strong>${total - answered}</strong></li>
        <li><span>Marked for review</span><strong>${marked}</strong></li>
        <li><span>Time left</span><strong>${fmtTime(remaining())}</strong></li>
      </ul>
      <div class="btn-row"><button type="button" class="btn btn-outline" data-act="cancel">Keep working</button><button type="button" class="btn btn-primary" data-act="confirm">Submit now</button></div></div>`;
    document.body.appendChild(m);
    m.addEventListener('click', e => { if (e.target === m) closeModal(); else onClick(e); });
  }

  function finish(auto) {
    if (!S || S.done) return;
    commitTime(); clearInterval(timer); closeModal();
    S.done = true; runnerOn = false;
    const elapsed = Math.min(S.durSec, Math.floor((Date.now() - S.start) / 1000));
    let correct = 0, wrong = 0, skipped = 0; const wrongIds = [], rightIds = [];
    S.qids.forEach(id => {
      const q = QMAP[id], a = S.ans[id];
      if (a === undefined) skipped++; else if (a === q.ans) { correct++; rightIds.push(id); } else { wrong++; wrongIds.push(id); }
    });
    const att = {
      id: 'a' + Date.now().toString(36) + Math.floor(Math.random() * 1296).toString(36),
      title: S.title, mode: S.mode, kind: S.kind, testId: S.testId, date: new Date().toISOString(),
      total: S.qids.length, correct, wrong, unattempted: skipped, score: correct, max: S.qids.length,
      timeSec: elapsed, durMin: Math.round(S.durSec / 60), qids: S.qids, answers: S.ans, qtime: S.qt || {},
      user: S.user || null, url: 'test-attempt.html' + S.sig, auto: !!auto
    };
    if (typeof track === 'function') track('test_finish', { pct: att.total ? Math.round(att.correct / att.total * 100) : 0, kind: att.kind });
    const list = getAttempts(); list.unshift(att); setAttempts(list.slice(0, 100));
    const w = new Set(getWrong()); wrongIds.forEach(id => w.add(id)); rightIds.forEach(id => w.delete(id)); setWrong([...w]);
    store.del(SESS);
    if (auto) showToast('Time is up — your test was submitted automatically.');
    const go = () => location.replace('test-result.html?id=' + encodeURIComponent(att.id) + (auto ? '&auto=1' : ''));
    if (typeof SERVER_MODE !== 'undefined' && SERVER_MODE) reportToServer(att, S.examId).then(go, go); else go();
  }

  /* when the ExamPro server is running and a student is signed in, record the result in their account.
     The server checks eligibility, the exam window and the attempt limit; it cannot re-grade because the questions live in this static site. */
  function reportToServer(att, examId) {
    const work = fetch('/api/student/me', { credentials: 'same-origin' }).then(r => r.ok ? r.json() : null).then(me => {
      if (!me) return;
      return fetch('/api/student/results', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': me.csrf },
        body: JSON.stringify({ exam_id: examId ? +examId : undefined, title: att.title, score: att.correct, total: att.total, duration_sec: att.timeSec }) });
    }).catch(() => {});
    return Promise.race([work, new Promise(r => setTimeout(r, 3000))]);
  }

  /* ---------- navigation ---------- */
  function goTo(i) { if (i >= 0 && i < S.qids.length) { S.cur = i; draw(); } }
  function goNext() { if (S.cur < S.qids.length - 1) goTo(S.cur + 1); else showToast('This is the last question — press Submit when you are ready.'); }
  function pick(i) { const q = QMAP[S.qids[S.cur]]; if (i < 0 || i >= q.opts.length) return; S.ans[S.qids[S.cur]] = i; draw(); }
  function toggleMark() {
    const qid = S.qids[S.cur];
    if (S.marked[qid]) { delete S.marked[qid]; draw(); } else { S.marked[qid] = 1; if (S.cur < S.qids.length - 1) goTo(S.cur + 1); else draw(); }
  }

  function onClick(e) {
    const el = e.target.closest('[data-act],[data-opt],[data-go]');
    if (!el) return;
    const act = el.dataset.act;
    if (act === 'start') { startTest(); return; }
    if (!S || S.done) return;
    if (act === 'cancel') { closeModal(); return; }
    if (act === 'confirm') { finish(false); return; }
    if (!runnerOn) return;
    if (el.dataset.opt !== undefined) { pick(parseInt(el.dataset.opt, 10)); return; }
    if (el.dataset.go !== undefined) { goTo(parseInt(el.dataset.go, 10)); return; }
    const qid = S.qids[S.cur];
    if (act === 'prev') goTo(S.cur - 1);
    else if (act === 'next') goNext();
    else if (act === 'clear') { delete S.ans[qid]; draw(); }
    else if (act === 'mark') toggleMark();
    else if (act === 'bm') { const on = toggleBookmark(qid); showToast(on ? 'Saved to your bookmarks' : 'Removed from bookmarks'); draw(); }
    else if (act === 'font') { bigText = !bigText; store.set('exampro-bigtext', bigText); draw(); }
    else if (act === 'submit') openSubmit();
  }
  app.addEventListener('click', onClick);

  document.addEventListener('keydown', e => {
    if (!runnerOn || !S || S.done || document.getElementById('modal')) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const tag = (e.target.tagName || '').toUpperCase();
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    if (e.key === 'ArrowRight') { e.preventDefault(); goNext(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(S.cur - 1); }
    else if (e.key.length === 1) {
      const k = e.key.toLowerCase();
      if (k === 'm') { toggleMark(); return; }
      const n = '1234'.indexOf(k), l = 'abcd'.indexOf(k);
      if (n >= 0) pick(n); else if (l >= 0) pick(l);
    }
  });

  /* keep time when the tab is hidden or closed */
  document.addEventListener('visibilitychange', () => { if (document.hidden && runnerOn && S && !S.done) { commitTime(); saveSession(); } else if (!document.hidden) { tqStart = Date.now(); } });
  window.addEventListener('pagehide', () => { if (runnerOn && S && !S.done) { commitTime(); saveSession(); } });

  /* ---------- boot ---------- */
  function boot() {
    if (P.get('review')) { location.replace('test-result.html?id=' + encodeURIComponent(P.get('review'))); return; }
    CFG = buildConfig();
    const sess = loadSession(location.search);
    if (sess) {
      sess.qids = sess.qids.filter(id => QMAP[id]);
      if (sess.qids.length) {
        S = sess; S.ans = S.ans || {}; S.marked = S.marked || {}; S.visited = S.visited || {}; S.qt = S.qt || {};
        S.cur = Math.min(Math.max(0, S.cur || 0), S.qids.length - 1);
        if (remaining() <= 0) { finish(true); return; }
        renderRunner(); return;
      }
      store.del(SESS);
    }
    if (CFG.error) { renderError(CFG.error); return; }
    renderIntro();
  }
  boot();
})();
</script>
